name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate designs
        run: npm run validate
      - name: Build designs and site
        run: npm run build:site
      - name: CODEOWNERS is up to date
        run: git diff --exit-code .github/CODEOWNERS || (echo "Run npm run build and commit .github/CODEOWNERS" && exit 1)
